name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Assemble only the site itself. Uploading the repo root would publish
      # the tests, the README and the workflow files alongside it.
      # CNAME must be included or the custom domain is dropped on every deploy.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js assets CNAME _site/
          echo "--- deploying ---"
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
