<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CET10 Hub</title>
<meta name="description" content="One tap to book classes at CEM Bac de Roda, CEM Júpiter and CEM Maresme.">

<meta name="theme-color" content="#61B4E4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1b22" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/img/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CET10">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preload" href="assets/fonts/roboto-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <div class="lockup">
      <span class="lockup__word">CET<span class="lockup__num">10</span></span>
      <svg class="lockup__mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <circle cx="16" cy="16" r="16" fill="currentColor"/>
        <circle cx="16" cy="10.6" r="3.2" class="lockup__mark-cut"/>
        <path d="M7.6 14.8 16 16.9l8.4-2.1M16 16.9l-4.8 8.6M16 16.9l4.8 8.6"
              class="lockup__mark-cut-stroke" stroke-width="3.2"
              stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <span class="lockup__hub">Hub</span>
    </div>
    <p class="masthead__tagline" data-i18n="tagline">Book classes at your centres</p>
  </div>
</header>

<nav class="quickbook wrap" id="quickbook" aria-label="Quick book"></nav>

<div class="wrap">
  <p class="notice" id="bookingNotice" role="note" hidden></p>
</div>

<main class="wrap" id="main">
  <div class="toolbar">
    <div class="toolbar__buttons">
      <button type="button" class="pill-btn" id="sort" aria-pressed="false"></button>
      <button type="button" class="pill-btn" id="openNow" aria-pressed="false"></button>
      <button type="button" class="pill-btn pill-btn--reset" id="reset" hidden></button>
    </div>
    <p class="toolbar__privacy" id="sortNote"></p>
  </div>

  <ul class="gyms" id="gyms" aria-label="Centres"></ul>

  <p class="empty" id="empty" hidden></p>

  <noscript>
    <ul class="gyms gyms--plain">
      <li><a href="https://cet10bdr.deporsite.net/reserva-clases">CEM Bac de Roda — book a class</a></li>
      <li><a href="https://cet10jupiter.deporsite.net/reserva-clases">CEM Júpiter — book a class</a></li>
      <li><a href="https://cet10maresme.deporsite.net/reserva-clases">CEM Maresme — book a class</a></li>
    </ul>
  </noscript>
</main>

<footer class="wrap site-footer">
  <button type="button" class="install" id="install" hidden></button>
  <p class="site-footer__note" data-i18n="footer">Links to the official CET10 portals. Not an official app.</p>
  <div class="langs" id="langs" role="group" aria-label="Language"></div>
</footer>

<p class="offline-banner" id="offline" role="status" hidden data-i18n="offline"></p>

<dialog class="info" id="installDialog">
  <h2 class="info__title" id="installTitle"></h2>
  <p class="info__lead" id="installLead" hidden></p>
  <ol class="steps" id="installSteps"></ol>
  <div class="info__actions">
    <button type="button" class="btn btn--primary" id="installClose"></button>
  </div>
</dialog>

<dialog class="info" id="infoDialog">
  <h2 class="info__title" id="infoTitle"></h2>
  <div class="info__body" id="infoBody"></div>
  <div class="info__actions">
    <a class="btn btn--ghost" id="infoPortal" target="_blank" rel="noopener noreferrer"></a>
    <button type="button" class="btn btn--primary" id="infoClose"></button>
  </div>
</dialog>

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
