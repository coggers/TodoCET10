<!doctype html>
<html lang="en" data-loading>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CET10 Hub</title>
<meta name="description" content="One tap to book classes at CEM Bac de Roda, CEM Júpiter and CEM Maresme.">

<!-- Not ready to be found yet: the gym photos are being replaced with originals.
     Remove this and robots.txt together when launching. -->
<meta name="robots" content="noindex, nofollow">

<meta name="theme-color" content="#61B4E4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12303d" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://web3forms.com https://hcaptcha.com https://*.hcaptcha.com; style-src 'self' 'unsafe-inline' https://hcaptcha.com https://*.hcaptcha.com; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.web3forms.com https://hcaptcha.com https://*.hcaptcha.com; frame-src https://hcaptcha.com https://*.hcaptcha.com; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/img/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CET10">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preload" href="assets/fonts/roboto-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/styles.css">
<noscript><style>[data-loading] .quickbook,[data-loading] .toolbar,[data-loading] #gyms,
[data-loading] .site-footer{opacity:1!important;visibility:visible!important}</style></noscript>
</head>
<body>

<header class="masthead">
  <div class="wrap masthead__inner">
    <div class="masthead__text">
    <h1 class="lockup">
      <span class="lockup__word">CET<span class="lockup__num">10</span></span>
      <svg class="lockup__mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <circle cx="16" cy="16" r="16" fill="currentColor"/>
        <circle cx="16" cy="10.6" r="3.2" class="lockup__mark-cut"/>
        <path d="M7.6 14.8 16 16.9l8.4-2.1M16 16.9l-4.8 8.6M16 16.9l4.8 8.6"
              class="lockup__mark-cut-stroke" stroke-width="3.2"
              stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <span class="lockup__hub">Hub</span>
    </h1>
    <p class="masthead__tagline" data-i18n="tagline">Book classes at your centres</p>
    </div>
    <button type="button" class="header-action" id="install"></button>
  </div>
</header>

<nav class="quickbook wrap" id="quickbook" aria-label="Quick book"></nav>

<div class="wrap">
  <p class="notice" id="bookingNotice" role="note" hidden></p>
</div>

<main class="wrap" id="main">
  <div class="toolbar">
    <div class="toolbar__buttons">
      <button type="button" class="pill-btn" id="sort" aria-pressed="false"></button>
      <button type="button" class="pill-btn" id="openNow" aria-pressed="false"></button>
      <button type="button" class="pill-btn pill-btn--reset" id="reset" hidden></button>
    </div>
    <p class="toolbar__privacy" id="sortNote"></p>
  </div>

  <ul class="gyms" id="gyms" aria-label="Centres" data-reserving></ul>

  <p class="empty" id="empty" hidden></p>

  <noscript>
    <ul class="gyms gyms--plain">
      <li><a href="https://cet10bdr.deporsite.net/reserva-clases">CEM Bac de Roda — book a class</a></li>
      <li><a href="https://cet10jupiter.deporsite.net/reserva-clases">CEM Júpiter — book a class</a></li>
      <li><a href="https://cet10maresme.deporsite.net/reserva-clases">CEM Maresme — book a class</a></li>
    </ul>
  </noscript>
</main>

<footer class="wrap site-footer">
  <p class="site-footer__note" data-i18n="footer">Links to the official CET10 portals. Not an official app.</p>
  <div class="footer-links" id="footerLinks"></div>
  <div class="langs" id="langs" role="group" aria-label="Language"></div>
</footer>

<p class="sr-only" id="liveStatus" role="status" aria-live="polite"></p>

<p class="offline-banner" id="offline" role="status" hidden data-i18n="offline"></p>

<dialog class="info share" id="shareDialog">
  <h2 class="info__title" id="shareTitle"></h2>
  <p class="share__lead" id="shareLead"></p>
  <div class="share__qr">
    <img src="assets/img/qr.svg" id="shareQr" width="512" height="512" alt="">
  </div>
  <p class="share__url" id="shareUrl"></p>
  <div class="info__actions">
    <button type="button" class="btn btn--primary" id="shareNative"></button>
    <button type="button" class="btn btn--ghost" id="shareClose"></button>
  </div>
</dialog>

<dialog class="info" id="privacyDialog">
  <h2 class="info__title" id="privacyTitle"></h2>
  <p class="privacy__updated" id="privacyUpdated"></p>
  <div class="privacy__body" id="privacyBody"></div>
  <div class="info__actions">
    <button type="button" class="btn btn--primary" id="privacyClose"></button>
  </div>
</dialog>

<div class="sheet-backdrop" id="feedbackBackdrop" hidden></div>
<dialog class="info info--sheet" id="feedbackDialog">
  <h2 class="info__title" id="feedbackTitle"></h2>
  <form id="feedbackForm" novalidate>
    <label class="field">
      <span class="field__label" id="feedbackMessageLabel"></span>
      <textarea class="field__input" id="feedbackMessage" rows="5" required maxlength="2000"></textarea>
    </label>
    <label class="field">
      <span class="field__label" id="feedbackContactLabel"></span>
      <input class="field__input" id="feedbackContact" type="email" autocomplete="email" maxlength="200">
    </label>
    <div class="h-captcha" data-captcha="true"></div>
    <p class="field__note" id="feedbackPrivacy"></p>
    <p class="field__error" id="feedbackError" role="alert" hidden></p>
    <div class="info__actions">
      <button type="submit" class="btn btn--primary" id="feedbackSend"></button>
      <button type="button" class="btn btn--ghost" id="feedbackCancel"></button>
    </div>
  </form>
  <div id="feedbackFallback" hidden>
    <p class="info__body-text" id="feedbackFallbackText"></p>
    <div class="info__actions">
      <a class="btn btn--primary" id="feedbackIssues" target="_blank" rel="noopener noreferrer"></a>
      <button type="button" class="btn btn--ghost" id="feedbackFallbackClose"></button>
    </div>
  </div>
  <p class="feedback__done" id="feedbackDone" hidden></p>
</dialog>

<dialog class="info" id="installDialog">
  <h2 class="info__title" id="installTitle"></h2>
  <p class="info__lead" id="installLead" hidden></p>
  <ol class="steps" id="installSteps"></ol>
  <div class="info__actions">
    <button type="button" class="btn btn--primary" id="installClose"></button>
  </div>
</dialog>

<dialog class="info" id="infoDialog">
  <h2 class="info__title" id="infoTitle"></h2>
  <div class="info__body" id="infoBody"></div>
  <div class="info__actions">
    <a class="btn btn--ghost" id="infoPortal" target="_blank" rel="noopener noreferrer"></a>
    <button type="button" class="btn btn--primary" id="infoClose"></button>
  </div>
</dialog>

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
